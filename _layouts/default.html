<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign page_title = page.title | default: "Claryo" %}
<title>{{ page_title }} — Claryo: Paycheck System</title>
{%- if page.description %}
<meta name="description" content="{{ page.description }}">
{%- endif %}
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F2F8">
<meta property="og:title" content="{{ page_title }} — Claryo: Paycheck System">
<meta property="og:image" content="https://claryoapp.com/assets/icon-512.png">
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<style>
  /* The landing page's own tokens and chrome (index.html), so every page reads as one site.
     The support page and the Markdown legal pages (privacy/, terms/) all render through this layout. */
  @font-face { font-family: Figtree; font-weight: 400; font-display: swap; src: url("{{ '/assets/fonts/Figtree-Regular.ttf' | relative_url }}") format("truetype"); }
  @font-face { font-family: Figtree; font-weight: 600; font-display: swap; src: url("{{ '/assets/fonts/Figtree-SemiBold.ttf' | relative_url }}") format("truetype"); }
  @font-face { font-family: Figtree; font-weight: 700; font-display: swap; src: url("{{ '/assets/fonts/Figtree-Bold.ttf' | relative_url }}") format("truetype"); }
  @font-face { font-family: Figtree; font-weight: 800; font-display: swap; src: url("{{ '/assets/fonts/Figtree-ExtraBold.ttf' | relative_url }}") format("truetype"); }

  :root {
    --ground: #F5F2F8;
    --ink: #1B1830;
    --muted: #5E5A70;
    --line: rgba(27, 24, 48, 0.12);
    --card: #FFFFFF;
    --edge: rgba(122, 117, 127, 0.42);   /* elevatedPanelDecoration's outline */
    --hair: rgba(122, 117, 127, 0.35);   /* sheetListHairline */
    --purple: #7B6BAE;
    --gutter: 16px;
  }
  @media (min-width: 640px) { :root { --gutter: 32px; } }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; border-radius: 4px; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 var(--gutter); }

  /* ── Header ── */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.125rem; letter-spacing: -0.01em; text-decoration: none; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .top nav { display: flex; gap: 20px; font-size: 0.9375rem; color: var(--muted); }
  .top nav a { text-decoration: none; }
  .top nav a:hover, .top nav a[aria-current] { color: var(--ink); }
  /* On a phone every link is a 44-point target: padding out, margin back, so nothing moves. */
  @media (max-width: 879px) {
    .brand { padding: 6px 0; margin: -6px 0; }
    .top nav a { padding: 10px; margin: -10px; }
  }

  /* ── The page: one readable column ── */
  main { max-width: 760px; padding: 40px 0 72px; }
  @media (min-width: 880px) { main { padding: 56px 0 96px; } }
  h1 {
    margin: 0 0 16px;
    font-weight: 800;
    font-size: clamp(2.25rem, 1.6rem + 2.6vw, 3.25rem);
    line-height: 1.05;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .lead { margin: 0 0 32px; font-size: 1.1875rem; color: var(--muted); max-width: 34em; text-wrap: pretty; }

  /* elevatedPanelDecoration: radius 26, the outline, two neutral shadows. Content zones inside
     are hairline-divided rows, never boxes (house-rules §1; design-refs/good-job-18.png). */
  .card {
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 26px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.11), 0 10px 33px rgba(0, 0, 0, 0.055);
    overflow: hidden;
  }
  .card > section { padding: 24px; }
  @media (min-width: 640px) { .card > section { padding: 28px 32px; } }
  .card > section + section { border-top: 1px solid var(--hair); }
  .card h2 { margin: 0 0 8px; font-weight: 700; font-size: 1.25rem; line-height: 1.3; letter-spacing: -0.015em; }
  .card p { margin: 0; color: var(--muted); text-wrap: pretty; }
  .card p + p { margin-top: 12px; }
  .card .more { margin-top: 14px; font-weight: 600; color: var(--ink); }
  .card .more a { text-underline-offset: 3px; }
  /* The address is the page's one prominent thing: it is what a reviewer and a stuck buyer came for. */
  .address {
    display: inline-block; margin-top: 12px;
    font-weight: 700; font-size: clamp(1.25rem, 1.05rem + 1vw, 1.5rem); letter-spacing: -0.02em;
    color: var(--ink); text-decoration-thickness: 2px; text-underline-offset: 5px;
    overflow-wrap: anywhere;
  }

  /* ── The legal texts: the same column, set for long reading ── */
  .doc { max-width: 40em; }
  .doc h1 { margin-bottom: 8px; }
  .doc h1 + p { color: var(--muted); margin-bottom: 32px; }
  .doc h2 { margin: 40px 0 12px; font-weight: 700; font-size: 1.375rem; line-height: 1.3; letter-spacing: -0.02em; scroll-margin-top: 24px; }
  .doc h3 { margin: 28px 0 8px; font-weight: 700; font-size: 1.125rem; line-height: 1.35; }
  .doc p, .doc ul, .doc ol { margin: 0 0 16px; }
  .doc ul, .doc ol { padding-left: 1.25em; }
  .doc li + li { margin-top: 6px; }
  .doc a { text-underline-offset: 3px; }
  .doc blockquote {
    margin: 0 0 32px; padding: 14px 18px;
    background: var(--card); border: 1px solid var(--edge); border-radius: 16px;
    color: var(--muted); font-size: 0.9375rem;
  }
  .doc blockquote p { margin: 0; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
  .doc table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 0.9375rem; display: block; overflow-x: auto; }
  .doc th, .doc td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .doc code { font-size: 0.9em; }

  /* ── Footer ── */
  footer { border-top: 1px solid var(--line); padding: 32px 0 48px; color: var(--muted); font-size: 0.9375rem; }
  footer .wrap { display: grid; gap: 16px; }
  @media (min-width: 720px) { footer .wrap { grid-template-columns: 1fr auto; align-items: center; } }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  footer nav a { text-decoration: none; }
  footer nav a:hover { color: var(--ink); }
  /* 44-point targets, as in the header; wrapped rows sit far enough apart that theirs never overlap. */
  @media (max-width: 879px) {
    footer nav { row-gap: 20px; }
    footer nav a { padding: 10px 0; margin: -10px 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/apple-touch-icon.png' | relative_url }}" alt="">Claryo</a>
    <nav aria-label="Site">
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
      <a href="{{ '/terms/' | relative_url }}"{% if page.url == '/terms/' %} aria-current="page"{% endif %}>Terms</a>
    </nav>
  </header>
  <main{% if page.doc != false %} class="doc"{% endif %}>
{{ content }}
  </main>
</div>
<footer>
  <div class="wrap">
    <span>© 2026 Michael Lorenzo Ponce Sanchez</span>
    <nav aria-label="Footer">
      <a href="{{ '/support/' | relative_url }}">Support</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
      <a href="{{ '/terms/' | relative_url }}">Terms of Use</a>
      <a href="mailto:hello@claryoapp.com">hello@claryoapp.com</a>
    </nav>
  </div>
</footer>
</body>
</html>
